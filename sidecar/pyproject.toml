[project]
name = "bookkeeper"
version = "0.1.0"
description = "AI-assisted envelope-budgeting bookkeeper over a beancount ledger"
requires-python = ">=3.12"
dependencies = [
    "beancount>=3.0.0",
    "beangulp>=0.2.0",
    "beanquery>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0",
]

[project.scripts]
bookkeeper = "bookkeeper.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-httpx>=0.35.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bookkeeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
